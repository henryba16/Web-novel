		<style>
			#cloud-nudge {
				position: fixed; left: 0; right: 0; bottom: 0; z-index: 1200;
				display: flex; gap: 0.75rem; align-items: center; justify-content: center;
				flex-wrap: wrap; padding: 0.6rem 1rem;
				background: #fffaf3; color: #2d2d2d;
				border-top: 1px solid #d6baa1;
				box-shadow: 0 -8px 24px rgba(45, 30, 25, 0.10);
				font-family: "Noto Serif", Georgia, "Palatino Linotype", "Book Antiqua", "DejaVu Serif", serif; font-size: 0.82rem;
			}
			#cloud-nudge[hidden] { display: none; }
			#cloud-nudge a, #cloud-nudge button {
				color: #fffaf3; background: #2d2d2d; border: none; border-radius: 999px;
				padding: 0.35rem 1rem; font-size: 0.82rem; font-weight: 700;
				text-decoration: none; cursor: pointer; font-family: inherit;
			}
			#cloud-nudge a:active, #cloud-nudge button:active { transform: translateY(1px) scale(0.99); }
			#cloud-nudge a:focus-visible, #cloud-nudge button:focus-visible { outline: 3px solid #596c58; outline-offset: 2px; }
			#cloud-nudge .cloud-nudge-home { background: transparent; color: #596c58; border: 1px solid #596c58; }
			@media (max-width: 560px) { #cloud-nudge .cloud-nudge-msg { flex-basis: 100%; text-align: center; } }
			.cloud-save-sync {
				display: flex; gap: 0.6rem; align-items: center; justify-content: center;
				flex-wrap: wrap; padding: 0.8rem 0.5rem; font-family: Georgia, "Palatino Linotype", "Book Antiqua", "DejaVu Serif", serif;
				border-top: 1px dashed rgba(255, 250, 243, 0.4); margin-top: 0.8rem;
			}
			.cloud-save-sync a, .cloud-save-sync button {
			 color: #1a1a2e; background: #fffaf3; border: none; border-radius: 999px;
				padding: 0.4rem 1.1rem; font-size: 0.85rem; font-weight: 700;
				text-decoration: none; cursor: pointer; font-family: inherit;
			}
			.cloud-save-note { font-size: 0.8rem; opacity: 0.85; }
		</style>
