<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | SchoolShield</title>
    <meta name="description" content="Tạo tài khoản SchoolShield để lưu tiến trình đám mây và tham gia lớp học.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co">
    <link rel="icon" href="assets/icons/icon.ico" type="image/png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <style>
        :root {
            --paper: #fffaf3; --ink: #2d2d2d; --muted: #706d63;
            --line: #d6baa1; --sage-dark: #596c58; --sage-light: #eef1e8;
            --serif: "Noto Serif", "Noto Serif JP", Georgia, "Palatino Linotype", "Book Antiqua", "DejaVu Serif", "Times New Roman", serif;
        }
        * { box-sizing: border-box; }
        body { font-family: var(--serif); background: #f7f0e8; color: var(--ink); margin: 0; min-height: 100vh; line-height: 1.7; }
        .wrap { max-width: 560px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
        .topnav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .topnav a { color: var(--sage-dark); font-weight: 700; text-decoration: none; font-size: 0.9rem; }
        .card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 1.75rem; margin-bottom: 1.25rem; }
        h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
        h2 { font-size: 1.15rem; margin: 0 0 1rem; }
        .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 1rem; }
        label { display: block; font-size: 0.85rem; font-weight: 700; margin: 0.75rem 0 0.25rem; }
        input, select { width: 100%; padding: 0.7rem 0.8rem; font-size: 1rem; font-family: inherit; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
        button { display: inline-block; margin-top: 1rem; padding: 0.8rem 1.6rem; font-size: 0.95rem; font-weight: 700; font-family: inherit; color: var(--paper); background: var(--ink); border: 1px solid var(--ink); border-radius: 999px; cursor: pointer; }
        button:hover { background: var(--sage-dark); border-color: var(--sage-dark); }
        button[disabled] { opacity: 0.55; cursor: wait; }
        .status { margin-top: 0.9rem; font-size: 0.88rem; min-height: 1.4em; }
        .status.ok { color: var(--sage-dark); }
        .status.err { color: #9c3b2e; }
        .fine { font-size: 0.82rem; color: var(--muted); margin-top: 0.75rem; }
        .fine a { color: var(--sage-dark); }
    </style>
</head>
<body>
    <div class="wrap">
        <nav class="topnav">
            <a href="index.html">← Trang chủ</a>
            <a href="login.html">Đã có tài khoản? Đăng nhập</a>
        </nav>

        <div class="card">
            <h1>SchoolShield</h1>
            <p class="sub">Tạo tài khoản để lưu tiến trình đám mây và tham gia lớp học. Chơi khách không cần tài khoản — <a href="game.html">vào game ngay</a>.</p>
            <p class="status" id="cloud-state" role="status" aria-live="polite"></p>
        </div>

        <section class="card" aria-labelledby="signup-h">
            <h2 id="signup-h">Tạo tài khoản</h2>
            <form id="signup-form">
                <label for="su-name">Tên hiển thị</label>
                <input id="su-name" name="displayName" type="text" autocomplete="nickname" maxlength="80" placeholder="VD: An">
                <label for="su-email">Email</label>
                <input id="su-email" name="email" type="email" autocomplete="email" required placeholder="ban@vidu.vn">
                <label for="su-pass">Mật khẩu</label>
                <input id="su-pass" name="password" type="password" autocomplete="new-password" required placeholder="Mật khẩu (máy chủ sẽ báo nếu quá yếu)">
                <label for="su-role">Vai trò</label>
                <select id="su-role" name="role">
                    <option value="student">Học sinh</option>
                    <option value="teacher">Giáo viên</option>
                </select>
                <button type="submit" id="su-btn">Đăng ký</button>
            </form>
            <p class="status" id="su-status" role="status" aria-live="polite"></p>
            <p class="fine">Đã có tài khoản? <a href="login.html">Đăng nhập</a>.</p>
        </section>
    </div>

    <script src="./js/supabase-config.js"></script>
    <script src="./js/cloud-client.js"></script>
    <script src="./js/cloud-run.js"></script>
    <script src="./js/cloud-sync.js"></script>
    <script src="./js/cloud-auth.js"></script>
    <script src="./js/cloud-classes.js"></script>
    <script>
        (function () {
            'use strict';
            var cloudState = document.getElementById('cloud-state');
            var suForm = document.getElementById('signup-form');
            var suStatus = document.getElementById('su-status');
            var suBtn = document.getElementById('su-btn');

            function setStatus(node, kind, text) {
                node.className = 'status' + (kind ? ' ' + kind : '');
                node.textContent = text || '';
            }

            function cloudReady() {
                if (!window.CloudClient || !window.CloudClient.isEnabled()) {
                    setStatus(cloudState, 'err', 'Chế độ đám mây chưa được cấu hình trên bản dựng này — bạn vẫn có thể chơi khách.');
                    suBtn.disabled = true;
                    return false;
                }
                var s = window.CloudClient.getSession();
                setStatus(
                    cloudState,
                    s ? 'ok' : '',
                    s && s.user ? 'Đang đăng nhập: ' + s.user.email : 'Chưa đăng nhập. Chế độ đám mây sẵn sàng.'
                );
                return true;
            }

            suForm.addEventListener('submit', async function (ev) {
                ev.preventDefault();
                if (!cloudReady()) return;
                var email = document.getElementById('su-email').value.trim();
                var password = document.getElementById('su-pass').value;
                var role = document.getElementById('su-role').value;
                var displayName = document.getElementById('su-name').value.trim();
                suBtn.disabled = true;
                setStatus(suStatus, '', 'Đang tạo tài khoản…');
                try {
                    var res = await window.CloudAuth.signUp(email, password, role, displayName);
                    suBtn.disabled = true;
                    if (res.needsConfirmation) {
                        setStatus(suStatus, 'ok', 'Đăng ký thành công! Kiểm tra email để xác nhận tài khoản, đang chuyển sang trang đăng nhập…');
                        setTimeout(function () {
                            window.location.href = 'login.html';
                        }, 1800);
                    } else {
                        setStatus(suStatus, 'ok', 'Đăng ký thành công! Đang chuyển hướng…');
                        setTimeout(function () {
                            window.CloudAuth.goToLanding(res.profile && res.profile.role);
                        }, 1200);
                    }
                } catch (err) {
                    setStatus(suStatus, 'err', 'Đăng ký thất bại: ' + ((err && err.message) || 'lỗi không rõ'));
                } finally {
                    suBtn.disabled = false;
                }
            });

            cloudReady();
        }());
    </script>
</body>
</html>
